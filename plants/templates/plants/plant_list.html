<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои растения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div>
            🌿 Привет, {{ request.user.username }}!
        </div>
        <div class="d-flex gap-2">
            <a href="{% url 'add_plant' %}" class="btn btn-success btn-sm">Добавить растение</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="text-center text-success mb-4">Мой сад</h2>

    <div class="row justify-content-center">
        {% for plant in plants %}
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-success">{{ plant.plant_type.name }}</h5>
                    <p class="card-text"><strong>Тип:</strong> {{ plant.plant_type.category.name }}</p>
                    <a href="{% url 'plant_detail' plant.pk %}" class="btn btn-outline-success btn-sm mt-2">Подробнее</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center">У вас пока нет растений. <a href="{% url 'add_plant' %}">Добавить первое</a></p>
        {% endfor %}
    </div>
</div>

</body>
</html>
