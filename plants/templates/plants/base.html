<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добро пожаловать в Garden Web Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <h1 class="text-success mb-4">🌿 Garden Web Service</h1>
    <p class="lead">Помогаем ухаживать за растениями и получать советы по поливу и защите!</p>

    <div class="d-flex justify-content-center gap-3 mb-4">
        <a href="{% url 'register' %}" class="btn btn-success">Регистрация</a>
        <a href="{% url 'login' %}" class="btn btn-outline-success">Вход</a>
    </div>

    <h3 class="mt-5 mb-3">Каталог растений</h3>
    <div class="row justify-content-center">
        {% for plant in plants %}
        <div class="col-md-2 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-success">{{ plant.plant_type.name }}</h5>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
